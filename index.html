<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  />

  <!-- Apple touch icon (iOS home screen) -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23065f46'/%3E%3Cpath d='M44 20A16 16 0 1 0 44 44' stroke='%2334d399' stroke-width='8' stroke-linecap='round' fill='none'/%3E%3Cpath d='M26 24L40 32L26 40Z' fill='%23a7f3d0'/%3E%3C/svg%3E"
  />

  <!-- Safari pinned tab -->
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#10b981" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/site.webmanifest?v=2" />

  <!-- Theme colors -->
  <meta name="theme-color" content="#065f46" />
  <meta name="msapplication-TileColor" content="#065f46" />
  <meta name="msapplication-config" content="none" />

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!--   MOBILE WEB APP — standard + legacy                        -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CINEVA" />
  <meta name="application-name" content="CINEVA" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title + description -->
  <title>CINEVA — Premium Streaming</title>
  <meta
    name="description"
    content="CINEVA — Premium streaming platform. Watch the latest movies and TV series in HD quality, anytime, anywhere."
  />
  <meta
    name="keywords"
    content="CINEVA, movies, streaming, films, watch online, TV shows, series, HD, premium"
  />
  <meta name="author" content="CINEVA" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (Facebook / WhatsApp / LinkedIn previews) -->
  <meta property="og:title" content="CINEVA — Premium Streaming" />
  <meta
    property="og:description"
    content="Watch the latest movies and TV series in HD quality on CINEVA."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cineva.app" />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:site_name" content="CINEVA" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CINEVA — Premium Streaming" />
  <meta
    name="twitter:description"
    content="Watch the latest movies and TV series in HD quality on CINEVA."
  />
  <meta name="twitter:image" content="/og-image.png" />

  <!-- Vimeo Player SDK -->
  <script src="https://player.vimeo.com/api/player.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
